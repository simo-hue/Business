<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.9/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"></script>
<style>body{margin:0;background:#fff;font-family:Poppins,Arial,sans-serif}
.mapbox{position:relative;width:704px;height:481px;background:#F1F2EF;border-radius:11px;overflow:hidden;zoom:4}
.mapbox .dm{position:absolute;inset:0}
  .mapbox .dm { position: absolute; inset: 0; }
  .mapbox .dm svg { width: 100% !important; height: 100% !important; }
  .mapbox .dm svg path.route { fill: none !important; stroke: #C9654A !important; stroke-linecap: round; }
  .mapbox .dm svg path.route.fan { stroke-width: 2.2px !important; stroke-dasharray: 9 7; }
  .mapbox .dm svg path.route.main { stroke-width: 4.5px !important; }
  .mapbox .dm svg path.pin { fill: #C9654A !important; stroke: #FBFBFB !important; stroke-width: 2.5px !important; }
  .mapbox .dm svg path.leader { fill: none !important; stroke: #171717 !important; stroke-width: 1.2px !important; }
.nomap{display:none}</style></head><body>
<div class="mapbox"><div class="dm" id="map"></div><div class="nomap" id="nomap" hidden></div></div>

<script>
(function () {
  var el = document.getElementById('map');
  if (typeof Datamap === 'undefined' || typeof d3 === 'undefined') { document.getElementById('nomap').hidden = false; return; }
  var open = ['NLD','SWE','DNK','FIN','BEL','POL','CHE'], gated = ['DEU','ITA'], closed = ['AUT'];
  var data = {};
  open.forEach(function (c) { data[c] = { fillKey: 'open' }; });
  gated.forEach(function (c) { data[c] = { fillKey: 'gated' }; });
  closed.forEach(function (c) { data[c] = { fillKey: 'closed' }; });
  var map;
  var inside = [['DEU', 'DE', 50.6, 10.6], ['SWE', 'SE', 60.6, 15.2], ['FIN', 'FI', 63.0, 26.2], ['POL', 'PL', 52.0, 19.4], ['ITA', 'IT', 44.4, 11.2], ['AUT', 'AT', 47.5, 14.7]];
  var leader = [['NLD', 'NL', 52.3, 5.4, -1, -34, 'START'], ['BEL', 'BE', 50.6, 4.6, -1, 14, null], ['DNK', 'DK', 56.0, 9.2, -1, -6, null], ['CHE', 'CH', 46.8, 8.2, -1, 12, null]];
  function draw() {
    el.innerHTML = '';
    var w = el.clientWidth || 600, h = el.clientHeight || 400;
    map = new Datamap({
      element: el, scope: 'world', responsive: false,
      setProjection: function (element) {
        var projection = d3.geo.mercator().center([13.6, 54.6]).scale(h * 1.5).translate([w / 2, h / 2]);
        return { path: d3.geo.path().projection(projection), projection: projection };
      },
      fills: { defaultFill: '#F1F2EF', open: '#171717', gated: '#497078', closed: '#D3D4D0' },
      data: data,
      geographyConfig: { borderColor: '#FBFBFB', borderWidth: 1.2, highlightOnHover: false, popupOnHover: false }
    });
    var svg = map.svg, proj = map.projection;
    // arrows: thin from NL to the open markets, thick to Germany
    var nl = [4.9, 52.37];
    var targets = { SWE: [18.07, 59.33], DNK: [12.57, 55.68], FIN: [24.94, 60.17], BEL: [4.35, 50.85], POL: [21.01, 52.23], CHE: [7.45, 46.95] };
    var g = svg.append('g');
    Object.keys(targets).forEach(function (k) {
      var a = proj(nl), b = proj(targets[k]);
      var mx = (a[0] + b[0]) / 2 + (b[1] - a[1]) * 0.18, my = (a[1] + b[1]) / 2 - (b[0] - a[0]) * 0.18;
      var d = 'M' + a[0] + ',' + a[1] + ' Q' + mx + ',' + my + ' ' + b[0] + ',' + b[1];
      g.append('path').attr('class', 'route fan').attr('d', d);
      g.append('circle').attr('cx', b[0]).attr('cy', b[1]).attr('r', 3.5).attr('fill', '#C9654A').attr('stroke', '#FBFBFB').attr('stroke-width', 1.5);
    });
    var de = proj([8.6, 51.9]), a = proj(nl);
    g.append('path').attr('class', 'route main').attr('d', 'M' + a[0] + ',' + a[1] + ' L' + de[0] + ',' + de[1]);
    g.append('circle').attr('cx', de[0]).attr('cy', de[1]).attr('r', 5).attr('fill', '#C9654A').attr('stroke', '#FBFBFB').attr('stroke-width', 2);
    // start pin on the Netherlands
    var k = Math.max(0.9, h / 520);
    var pin = g.append('g').attr('transform', 'translate(' + a[0] + ',' + a[1] + ') scale(' + k + ')');
    pin.append('path').attr('class', 'pin').attr('d', 'M0,-30 C-8,-30 -14,-24 -14,-16 C-14,-6 0,8 0,8 C0,8 14,-6 14,-16 C14,-24 8,-30 0,-30 Z');
    pin.append('circle').attr('cx', 0).attr('cy', -16).attr('r', 5).attr('fill', '#FBFBFB');
    // labels
    var fs = Math.round(Math.max(11, h / 30));
    var font = function (wgt) { return wgt + ' ' + fs + 'px Poppins, Arial, sans-serif'; };
    inside.forEach(function (L) {
      var p = proj([L[3], L[2]]), dark = L[0] !== 'AUT';
      var t = g.append('text').attr('x', p[0]).attr('y', p[1]).attr('text-anchor', 'middle').attr('dominant-baseline', 'middle').attr('fill', dark ? '#FBFBFB' : '#3B3E3C').style('font', font(700)).text(L[1]);
      if (L[0] === 'DEU') g.append('text').attr('x', p[0]).attr('y', p[1] + fs * 1.1).attr('text-anchor', 'middle').attr('dominant-baseline', 'middle').attr('fill', '#D9E6E7').style('font', '600 ' + Math.round(fs * 0.72) + 'px Poppins, Arial, sans-serif').style('letter-spacing', '.1em').text('LATER');
    });
    leader.forEach(function (L) {
      var p = proj([L[3], L[2]]), dx = L[4] * Math.round(h / 7), dy = L[5], x = p[0] + dx, y = p[1] + dy;
      g.append('path').attr('class', 'leader').attr('d', 'M' + p[0] + ',' + p[1] + ' L' + x + ',' + y);
      g.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 2.2).attr('fill', '#171717');
      var anchor = L[4] < 0 ? 'end' : 'start', pad = L[4] < 0 ? -6 : 6;
      g.append('text').attr('x', x + pad).attr('y', y).attr('text-anchor', anchor).attr('dominant-baseline', 'middle').attr('fill', '#171717').style('font', font(700)).text(L[1]);
      if (L[6]) g.append('text').attr('x', x + pad).attr('y', y - fs * 0.95).attr('text-anchor', anchor).attr('dominant-baseline', 'middle').attr('fill', '#497078').style('font', '600 ' + Math.round(fs * 0.72) + 'px Poppins, Arial, sans-serif').style('letter-spacing', '.1em').text(L[6]);
    });
  }
  draw();
  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(draw, 150); });
})();
</script>
</body></html>
