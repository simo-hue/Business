<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="332" viewBox="0 86 1280 332" role="img" aria-labelledby="flow-title">
<style>
text{font-family:Geist,Helvetica,Arial,sans-serif}
.zone{font-size:12px;font-weight:500;fill:#55676b;letter-spacing:.01em}
.lbl{font-size:14px;font-weight:500;fill:#1c2b2f}
.head{font-size:17px;font-weight:500;fill:#1c2b2f;letter-spacing:-.01em}
.cap{font-size:13px;fill:#55676b}
.card{fill:#fcfbf8}.faint{opacity:.55}.panel{fill:#e7edec}
.zonebox{fill:none;stroke:#cfd6d3;stroke-width:1;stroke-dasharray:5 6}
.ico{fill:none;stroke:#1c2b2f;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico .fill{fill:#1c2b2f;stroke:none}.ico .thin{stroke:#8a9a9d}
.wire{fill:none;stroke:#3e6670;stroke-width:1.1}.dot{fill:#3e6670}.ink{fill:#1c2b2f}.line2{fill:#cfd6d3}
.arrow{fill:none;stroke:#1c2b2f;stroke-width:1.2;marker-end:url(#fa)}
.ring{fill:none;stroke:#cfd6d3;stroke-width:1;stroke-dasharray:3 5}
.badge{fill:#3e6670}.tick{fill:none;stroke:#f6f4ee;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chev{fill:none;stroke:#1c2b2f;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.rule{stroke:#cfd6d3;stroke-width:1}
</style><defs>
<filter id="fs" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1c2b2f" flood-opacity=".08"/></filter>
<marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#1c2b2f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<!-- inside your company -->
<rect x="28" y="100" width="812" height="303" rx="14" class="zonebox"/>
<text x="52" y="128" class="zone">Inside your company</text>
<g filter="url(#fs)">
<rect x="52" y="145" width="192" height="46" rx="9" class="card"/>
<rect x="52" y="206" width="192" height="46" rx="9" class="card"/>
<rect x="52" y="267" width="192" height="46" rx="9" class="card"/>
<rect x="52" y="328" width="192" height="46" rx="9" class="card"/>
</g>
<g class="ico">
<g transform="translate(70,157)"><circle cx="5" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="17" cy="8" r="3"/><path d="M5 8v8M17 11c0 5-12 3-12 8"/></g>
<g transform="translate(69,219)"><path d="M7 20h13a5 5 0 0 0 .6-10A7 7 0 0 0 7.3 9 5.5 5.5 0 0 0 7 20z"/></g>
<g transform="translate(69,280)"><circle cx="9" cy="8" r="3.5"/><circle cx="18" cy="9" r="3"/><path d="M2 21a7 7 0 0 1 14 0M15 20a5 5 0 0 1 8 0"/></g>
<g transform="translate(70,342)"><circle cx="4" cy="9" r="1.6" class="fill"/><circle cx="12" cy="9" r="1.6" class="fill"/><circle cx="20" cy="9" r="1.6" class="fill"/></g>
</g>
<text x="114" y="173" class="lbl">Repositories</text>
<text x="114" y="234" class="lbl">Cloud accounts</text>
<text x="114" y="295" class="lbl">HR and CRM tools</text>
<text x="114" y="356" class="lbl">And more</text>
<!-- connectors -->
<g class="wire">
<path d="M244 168C300 168 320 251 380 251"/>
<path d="M244 229C300 229 320 251 380 251"/>
<path d="M244 290C300 290 320 251 380 251"/>
<path d="M244 351C300 351 320 251 380 251"/>
<path d="M380 251H405"/>
</g>
<g class="dot"><circle cx="244" cy="168" r="3"/><circle cx="244" cy="229" r="3"/><circle cx="244" cy="290" r="3"/><circle cx="244" cy="351" r="3"/><circle cx="380" cy="251" r="4"/></g>
<!-- report stack -->
<g filter="url(#fs)">
<rect x="441" y="157" width="122" height="112" rx="9" class="card faint"/>
<rect x="429" y="169" width="122" height="112" rx="9" class="card faint"/>
<rect x="417" y="181" width="122" height="112" rx="9" class="card faint"/>
<rect x="405" y="193" width="122" height="112" rx="9" class="card"/>
</g>
<g class="ink"><rect x="425" y="221" width="76" height="4" rx="2"/></g>
<g class="line2"><rect x="425" y="244" width="80" height="3" rx="1.5"/><rect x="425" y="261" width="64" height="3" rx="1.5"/><rect x="425" y="278" width="46" height="3" rx="1.5"/></g>
<text x="405" y="339" class="head">Report</text>
<text x="405" y="362" class="cap">What you run, where data flows.</text>
<text x="405" y="381" class="cap">No records, no file contents.</text>
<!-- arrow -->
<path d="M563 251H640" class="arrow"/>
<!-- representative -->
<g class="ring"><circle cx="720" cy="251" r="58"/><circle cx="720" cy="251" r="80"/></g>
<circle cx="720" cy="251" r="38" class="card" filter="url(#fs)"/>
<g class="ink"><circle cx="720" cy="241" r="11"/><path d="M698 272a22 16 0 0 1 44 0z"/></g>
<circle cx="748" cy="273" r="14" class="badge"/>
<path d="M741.5 273.5l4.5 4.5 9-9" class="tick"/>
<text x="663" y="325" class="head">Your representative</text>
<text x="663" y="348" class="cap">Reviews and approves.</text>
<text x="663" y="367" class="cap">Nothing leaves before this.</text>
<!-- arrow -->
<path d="M788 251H862" class="arrow"/>
<!-- platform panel -->
<rect x="887" y="103" width="345" height="300" rx="14" class="panel"/>
<text x="912" y="139" class="zone">Regulift platform</text>
<g filter="url(#fs)">
<rect x="912" y="164" width="295" height="50" rx="9" class="card"/>
<rect x="912" y="225" width="295" height="50" rx="9" class="card"/>
<rect x="912" y="286" width="295" height="50" rx="9" class="card"/>
</g>
<g class="ico">
<g transform="translate(932,178)"><circle cx="3" cy="4" r="1.4" class="fill"/><circle cx="3" cy="11" r="1.4" class="fill"/><circle cx="3" cy="18" r="1.4" class="fill"/><path d="M8 4h13M8 11h13M8 18h13"/></g>
<g transform="translate(932,239)"><path d="M4 20V13M11 20V5M18 20V9"/></g>
<g transform="translate(932,299)"><path d="M5 2h10l6 6v14H5z"/><path d="M15 2v6h6M9 13h8M9 17h6" class="thin"/></g>
</g>
<text x="977" y="194" class="lbl">Inventory and gap list</text>
<text x="977" y="255" class="lbl">Ranked actions</text>
<text x="977" y="316" class="lbl">Evidence pack for your lawyer</text>
<g class="chev"><path d="M1187 184l5 5-5 5"/><path d="M1187 245l5 5-5 5"/><path d="M1187 306l5 5-5 5"/></g>
<path d="M912 352H1207" class="rule"/>
<g class="ico" transform="translate(914,368)"><rect x="3" y="8" width="13" height="10" rx="2"/><path d="M6 8V5a3.5 3.5 0 0 1 7 0v3"/></g>
<text x="940" y="382" class="cap">Built from the approved report only.</text>
</svg>